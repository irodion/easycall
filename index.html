<!doctype html>
<html lang="en" data-theme="elderly">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a5276" />
    <meta name="description" content="Simple video calling for elderly users" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://8x8.vc https://*.firebaseio.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' blob: data: https:;
        connect-src 'self'
          https://*.firebaseio.com
          https://*.googleapis.com
          https://*.firebaseapp.com
          https://*.cloudfunctions.net
          wss://*.firebaseio.com
          https://8x8.vc
          wss://*.jitsi.net
          wss://*.8x8.vc
          https://*.8x8.vc
          https://www.google.com/recaptcha/
          http://127.0.0.1:*
          http://localhost:*;
        frame-src https://8x8.vc https://www.google.com/recaptcha/;
        worker-src 'self';
        media-src 'self' blob:;
        object-src 'none';
        base-uri 'self';
      "
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
